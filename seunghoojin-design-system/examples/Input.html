<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../css/tokens.css">
<link rel="stylesheet" href="../css/bundle.css">
<style>
  html, body { margin:0; }
  body { padding:24px 32px; }
  .row { display:flex; flex-wrap:wrap; align-items:center; gap:8px; }
</style>
</head>
<body class="ds-page">
<div class="ds-form">
<label class="ds-field"><span class="ds-field__label">Email</span><input class="ds-input" type="email" placeholder="name@example.com" aria-describedby="h-email"><span class="ds-field__hint" id="h-email">Used only to reply to you.</span></label>
<label class="ds-field"><span class="ds-field__label">Name</span><input class="ds-input" value="seunghoojin"></label>
<label class="ds-field ds-field--error"><span class="ds-field__label">Message</span><input class="ds-input" value="" aria-invalid="true" aria-describedby="e-msg"><span class="ds-field__error" id="e-msg">Please write at least one sentence.</span></label>
</div>
</body>
</html>
