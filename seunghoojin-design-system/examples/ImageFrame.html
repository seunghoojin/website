<div style="display:grid;grid-template-columns:repeat(3,295px);gap:7px;align-items:start"><div class="ds-box"><h3 class="ds-entry__title">3:2 photograph</h3><svg class="ds-frame" viewBox="0 0 300 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="3:2 photograph"><rect width="300" height="200" fill="#eeeeee"/><g fill="none" stroke="#454545" stroke-width="1.2"><rect x="48" y="36" width="204" height="128"/><line x1="126" y1="36" x2="126" y2="164"/><line x1="126" y1="100" x2="252" y2="100"/></g></svg><p style="margin-top:0">Within range: shown whole, at its own proportions.</p></div><div class="ds-box"><h3 class="ds-entry__title">4:1 panorama</h3><svg class="ds-frame" viewBox="0 0 400 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="4:1 panorama"><rect width="400" height="100" fill="#eeeeee"/><g fill="none" stroke="#454545" stroke-width="1.7"><line x1="32" y1="20" x2="368" y2="20"/><line x1="32" y1="32" x2="344" y2="32"/><line x1="32" y1="44" x2="320" y2="44"/><line x1="32" y1="56" x2="296" y2="56"/><line x1="32" y1="68" x2="272" y2="68"/><line x1="32" y1="80" x2="248" y2="80"/></g></svg><p style="margin-top:0">Wider than 2:1: framed at 2:1, cropped at the sides around the focus point.</p></div><div class="ds-box"><h3 class="ds-entry__title">1:2 section</h3><svg class="ds-frame" viewBox="0 0 100 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="1:2 section"><rect width="100" height="200" fill="#eeeeee"/><g fill="none" stroke="#454545" stroke-width="0.8"><rect x="16" y="36" width="68" height="128"/><line x1="42" y1="36" x2="42" y2="164"/><line x1="42" y1="100" x2="84" y2="100"/></g></svg><p style="margin-top:0">Taller than 4:5: framed at 4:5, cropped top and bottom around the focus point.</p></div></div>
</div>
